<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stress Buster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>Stress Buster</h1>
      <p class="lede">Add a face, pick a move, let it out.</p>
    </header>

    <main class="layout">
      <section class="play">
        <div class="meters">
          <div class="meter">
            <div class="meter-head">
              <span>Stress</span>
              <strong id="stressValue">100%</strong>
            </div>
            <div class="bar" role="progressbar" aria-label="Stress level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
              <div class="bar-fill" id="stressFill"></div>
            </div>
          </div>
          <div class="counters">
            <div><span class="k">Hits</span><strong id="hitCount">0</strong></div>
            <div><span class="k">Combo</span><strong id="comboCount">0</strong></div>
          </div>
        </div>

        <div class="stage" id="stage" role="group" aria-label="Play area">
          <div class="ground" aria-hidden="true"></div>

          <div class="slot">
            <div class="avatar-wrap" id="avatarWrap" tabindex="0" role="button"
                 aria-label="Character. Press Space or Enter to use the selected move.">
              <div class="avatar" id="avatar">
                <div class="avatar-face" id="avatarFace"></div>
                <div class="splats" id="splats"></div>
              </div>
              <div class="dizzy" id="dizzy" aria-hidden="true">💫</div>
            </div>
          </div>

          <canvas id="fx" aria-hidden="true"></canvas>
          <div id="floaters" aria-hidden="true"></div>

          <div class="drop-hint" aria-hidden="true">Drop a picture to use it as the face</div>
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>

        <div class="tools" id="tools" role="group" aria-label="Choose a move"></div>
      </section>

      <aside class="panel">
        <div>
          <h2>Your character</h2>
          <p>Attach any picture to use as the face. You can also drag one onto the play area or paste it.</p>
        </div>

        <input class="file-input" type="file" id="photoInput" accept="image/*">
        <label class="btn" for="photoInput">Attach a photo</label>
        <button type="button" class="btn secondary" id="removePhoto" hidden>Use the default face</button>

        <details class="adjust" id="adjust" hidden>
          <summary>Adjust photo</summary>
          <label class="slider">Zoom
            <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
          </label>
          <label class="slider">Move left or right
            <input type="range" id="panX" min="-40" max="40" step="1" value="0">
          </label>
          <label class="slider">Move up or down
            <input type="range" id="panY" min="-40" max="40" step="1" value="0">
          </label>
        </details>

        <div class="checks">
          <label class="check"><input type="checkbox" id="soundToggle" checked> Sound effects</label>
          <label class="check" id="hapticLabel"><input type="checkbox" id="hapticToggle" checked> Vibration</label>
        </div>

        <div class="row">
          <button type="button" class="btn secondary" id="wipeBtn">Wipe off the mess</button>
          <button type="button" class="btn secondary" id="resetBtn">Start over</button>
        </div>

        <p class="fine">Photos stay on this device. Nothing is uploaded.</p>
      </aside>
    </main>
  </div>

  <template id="defaultFace">
    <svg class="face-svg" data-mood="idle" viewBox="0 0 200 200" role="img" aria-label="Default cartoon face" preserveAspectRatio="xMidYMid slice">
      <rect width="200" height="200" fill="#ffd35a"/>
      <circle cx="42" cy="120" r="16" fill="#ff8a7a" opacity=".55"/>
      <circle cx="158" cy="120" r="16" fill="#ff8a7a" opacity=".55"/>

      <g class="mood m-idle">
        <ellipse cx="70" cy="88" rx="9" ry="12" fill="#2a1f3d"/>
        <ellipse cx="130" cy="88" rx="9" ry="12" fill="#2a1f3d"/>
        <circle cx="73" cy="83" r="3.5" fill="#fff"/>
        <circle cx="133" cy="83" r="3.5" fill="#fff"/>
        <path class="ink" d="M52 64 Q70 54 88 64"/>
        <path class="ink" d="M112 64 Q130 54 148 64"/>
        <path class="ink" d="M70 136 Q100 158 130 136"/>
      </g>

      <g class="mood m-hurt">
        <path class="ink" d="M56 76 L84 90 L56 104"/>
        <path class="ink" d="M144 76 L116 90 L144 104"/>
        <path class="ink" d="M48 60 L90 70"/>
        <path class="ink" d="M152 60 L110 70"/>
        <ellipse cx="100" cy="144" rx="17" ry="13" fill="#2a1f3d"/>
        <ellipse cx="100" cy="150" rx="9" ry="5" fill="#ff7a8a"/>
      </g>

      <g class="mood m-squeeze">
        <path class="ink" d="M56 88 Q70 100 84 88"/>
        <path class="ink" d="M116 88 Q130 100 144 88"/>
        <path class="ink" d="M62 144 q9 -12 19 0 t19 0 t19 0 t19 0"/>
        <path d="M160 52 q9 13 0 20 q-9 -7 0 -20z" fill="#8fd3ff"/>
      </g>

      <g class="mood m-happy">
        <path class="ink" d="M56 94 Q70 74 84 94"/>
        <path class="ink" d="M116 94 Q130 74 144 94"/>
        <path d="M64 122 Q100 174 136 122 Z" fill="#2a1f3d"/>
        <path d="M82 150 Q100 138 118 150 Q100 166 82 150Z" fill="#ff7a8a"/>
      </g>

      <g class="mood m-dizzy">
        <path class="ink" d="M58 76 L82 100 M82 76 L58 100"/>
        <path class="ink" d="M118 76 L142 100 M142 76 L118 100"/>
        <path class="ink" d="M62 142 q9 -10 19 0 t19 0 t19 0 t19 0"/>
      </g>
    </svg>
  </template>

  <script src="script.js"></script>
</body>
</html>
